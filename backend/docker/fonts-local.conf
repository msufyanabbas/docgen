<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Tawal's MOP is set in "Teshrin AR+LT", which is neither embedded in the
    document nor redistributable. Without a rule, every machine substitutes
    whatever it likes: the sandbox picked one font, the server picked DejaVu
    Sans (much wider), and the document reflowed - the cover title ended up on
    page 2 and the body spilled onto a third page.

    Carlito has Calibri-compatible metrics and is close to the intended width,
    so pinning it here makes the rendered PDF the same everywhere. Calibri is
    mapped too, since Word documents commonly fall back to it.
  -->
  <match target="pattern">
    <test name="family"><string>Teshrin AR+LT</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Teshrin AR+LT Medium</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Teshrin AR+LT ExtraLight</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
</fontconfig>
